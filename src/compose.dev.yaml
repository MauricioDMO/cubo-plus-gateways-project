name: gateways-dev

services:
  app:
    build:
      context: .
      target: development
    command: sh -c "pnpm install --frozen-lockfile && exec pnpm dev --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-gateways}:${POSTGRES_PASSWORD:-gateways_dev}@db:5432/${POSTGRES_DB:-gateways}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateways}
      POSTGRES_USER: ${POSTGRES_USER:-gateways}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateways_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  node_modules:
  next_cache:
